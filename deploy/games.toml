# ssharcade games registry — production. Deployed to /etc/arcade/games.toml
# (ARCADE_GAMES_PATH) on the host; mounted read-only into the router, and
# hot-reloaded within one probe cycle on edit — no router redeploy needed.
# Schema: ../docs/03-games-registry-and-health.md. Dev default: ../games.toml
# (loopback addressing for dev-local-fleet.sh).
#
# An entry whose backing container isn't up yet just shows `○ OFFLINE` in
# the menu rather than breaking anything (the health prober is designed for
# exactly this), so a game can be listed here ahead of its first deploy.

[[games]]
id      = "farm"
name    = "IDLE FARMER"
tagline = "Crops grow while you're away."
descriptors = ["idle", "prestige", "market", "leaderboard"]
addr    = "farm:2222"                # private-network host:port
host_key = ""                         # optional: pinned public key (authorized_keys
                                      # format). Empty = accept any (isolated net).
order   = 10
# No `version` here: farm's wish server embeds its internal/version const in
# its SSH banner, so the router's health-check prober reads it live on every
# probe cycle (see docs/03's "Fleet version scheme"). Setting a static value
# here would just be a second, driftable copy of the same truth.

[[games]]
id      = "moonminer"
name    = "MOON MINER"
tagline = "Drill asteroids, dodge pirates."
descriptors = ["extraction", "4 worlds", "push-your-luck"]
addr    = "moonminer:2222"
host_key = ""
order   = 20
# version: live-detected, same as farm above.

[[games]]
id      = "packetderby"
name    = "PACKET DERBY"
tagline = "Coming soon..."
descriptors = ["racing","multiplayer"]
addr    = "packetderby:2222"
host_key = ""
order   = 30
version = "1.0.0"