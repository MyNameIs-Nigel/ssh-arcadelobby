# Fleet deploy compose (docs/04-deployment-and-cicd.md's canonical shape):
# one EC2 host, one router public on 22, every game private on the
# ssharcade network. Deployed copy lives at /srv/ssharcade/docker-compose.yml
# on the host (see ../deploy/README.md for the full bootstrap).
#
# Readiness today (2026-08):
#   router, farm, moonminer — real images, real proxy-identity support, live.
#                     moonminer shipped as a playable prototype (not fully
#                     polished, but stable enough to go live) with its own
#                     ci.yml/release.yml + Dockerfile on the same
#                     Litestream/S3 durability pattern as farm's.
#   chess (GAMBIT) — service block and chess-data volume are here as of
#                     ssh-chess's phase2/06. It is the fleet's first
#                     multiplayer-capable game, though Phase 2 ships
#                     bot play only (the lobby's MULTIPLAYER item is
#                     visible and locked until Phase 3).
#                     Two things differ from its siblings, both on purpose:
#                     mem_limit is 512m rather than 256m because it runs up
#                     to four Stockfish processes, and its image is larger
#                     (~270 MB) because Stockfish embeds its NNUE net — an
#                     external net file cannot be read from a read-only
#                     rootfs.
#                     ORDERING: this service cannot start until the image
#                     exists at ghcr.io/mynameis-nigel/ssh-chess, which
#                     happens the first time ssh-chess's `main` runs its
#                     release.yml. Until then chess pulls nothing and the
#                     menu shows `○ GAMBIT OFFLINE`, which is the designed
#                     behaviour for an entry with no container, not a fault.
#
# Idle Farmer v1 (`idlefarmer`) was removed at the v2 cutover: its repo is
# retired and its registry entry went with commit d72d578. ssh-farm is v2 and
# carries the v1 save importer. Adding a game still touches only the compose
# file and games.toml, never the router binary — that goal is unchanged.
services:
  router:
    image: ghcr.io/mynameis-nigel/ssh-arcadelobby:latest
    ports:
      - "22:2222" # host 22 -> container 2222 (non-root bind)
    environment:
      ARCADE_LISTEN_PORT: "2222"
      ARCADE_HOST_KEY_PATH: /var/lib/arcade/ssh_host_key
      ARCADE_PROXY_KEY_PATH: /run/secrets/proxy_key
      ARCADE_GAMES_PATH: /etc/arcade/games.toml
      ARCADE_BANNER_PATH: /etc/arcade/banner/banner.toml
      ARCADE_DB_PATH: /var/lib/arcade/arcade.db
      # Durability (doc 06): router SQLite + two small key objects.
      # Leave unset for dev mode (see entrypoint.sh).
      LITESTREAM_REPLICA_URL: s3://ssharcade-snoigel-data/router/db
      # Refuse to serve unreplicated (§4.1, failure mode 1). Without this the
      # entrypoint's dev-mode fall-through would let a service whose replica URL
      # went missing keep serving players normally while nothing was being
      # backed up — silent until someone needed a restore. Production sets it;
      # dev and CI leave it unset and keep the escape hatch.
      ARCADE_REQUIRE_REPLICATION: "true"
      LITESTREAM_S3_REGION: us-east-1
      # Read-only mount of the host's canonical copy of the router's SSH host
      # key. This replaced an `mc cat` from S3 and, with it, the MC_HOST_s3
      # static key pair that used to sit in ALL FOUR services' environments:
      # mc cannot use the EC2 instance role, so it needed a long-lived access
      # key. Nothing in these containers authenticates to AWS any more except
      # litestream, which uses the instance role. The proxy key is unaffected —
      # it was and remains a Docker secret provisioned by hand on the host.
      ARCADE_HOST_KEY_SOURCE: /etc/arcade/hostkey/ssh_host_key
    volumes:
      - arcade-router-data:/var/lib/arcade
      - ./games.toml:/etc/arcade/games.toml:ro
      # Directory mount, not a single-file mount: a single-file bind mount
      # pins to the inode present at container start. Any host-side edit
      # that replaces rather than truncates the file (editors with
      # atomic-save/rename, scp, mv) silently orphans the mount — the
      # container keeps serving the old content forever, no error, no log,
      # until the container is recreated. Directory mounts resolve the path
      # dynamically and survive any write pattern.
      - ./banner:/etc/arcade/banner:ro
      # Directory mount for the same inode-pinning reason as the two above.
      # Its own subdirectory per service, so the router sees its own key and
      # no other service's.
      - ./private/keys/router:/etc/arcade/hostkey:ro
    secrets: [proxy_key]
    networks: [ssharcade]
    restart: unless-stopped
    stop_grace_period: 15s # router holds no state; die fast
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0

  farm:
    image: ghcr.io/mynameis-nigel/ssh-farm:latest
    # NO ports: — private network only; the router is the only way in.
    environment:
      FARM_LISTEN_PORT: "2222"
      FARM_HOST_KEY_PATH: /var/lib/farm/ssh_host_key
      FARM_DB_PATH: /var/lib/farm/farm.db
      FARM_RATE_LIMIT_PER_SECOND: "50" # router does public throttling
      # Without this, FARM_PROXY_KEYS_PATH is empty ("direct-only dev" per
      # internal/config), so the router's bridged connections never match
      # isProxyKey() and fall through to resolveDirect() — every player
      # would collapse onto ONE save slot (the router's own key), not
      # their own identity. This is the same proxy_keys trust file the
      # router's secrets provisioning generates (deploy/README.md).
      FARM_PROXY_KEYS_PATH: /etc/farm/proxy_keys
      # Moderation (§5.3). The denylist is host state — it exists in no
      # repository at all — so farm loads it from a file and refuses to boot
      # without one. Only farm gets this mount; moonminer, chess and the router
      # have no business reading it.
      FARM_MODERATION_PATH: /etc/farm/moderation/denylist.toml
      FARM_REQUIRE_MODERATION: "true"
      # Durability (doc 06 — canonical; leave unset for dev mode):
      LITESTREAM_REPLICA_URL: s3://ssharcade-snoigel-data/farm/db
      # Refuse to serve unreplicated (§4.1, failure mode 1). Without this the
      # entrypoint's dev-mode fall-through would let a service whose replica URL
      # went missing keep serving players normally while nothing was being
      # backed up — silent until someone needed a restore. Production sets it;
      # dev and CI leave it unset and keep the escape hatch.
      FARM_REQUIRE_REPLICATION: "true"
      LITESTREAM_S3_REGION: us-east-1
      # Read-only mount of the host's canonical copy of this service's SSH
      # host key — see the router's note above for why the MC_HOST_s3 static
      # key pair is gone.
      FARM_HOST_KEY_SOURCE: /etc/farm/hostkey/ssh_host_key
      # AWS credentials for litestream come from the EC2 instance role —
      # never set LITESTREAM_ACCESS_KEY_ID/SECRET in this file.
    volumes:
      - farm-data:/var/lib/farm
      - ./private/keys/farm:/etc/farm/hostkey:ro
      - ./proxy_keys:/etc/farm/proxy_keys:ro # PUBLIC half of the router's proxy key
      # DIRECTORY mount, not the single-file mount §5.3 sketches, and for the
      # reason already learned twice in this file (see the router's banner and
      # games.toml notes): a single-file bind mount pins to the inode present at
      # container start, so any host-side edit that replaces rather than
      # truncates — most editors' atomic save, scp, mv — silently orphans it.
      # That matters more here than anywhere else, because SIGHUP reload reads
      # this path from inside the container: an orphaned mount would make every
      # reload appear to succeed while serving the old list forever.
      #
      # Its own subdirectory rather than all of ./private, so farm sees the
      # denylist and nothing else that later lands in there.
      - ./private/farm:/etc/farm/moderation:ro
    networks: [ssharcade]
    restart: unless-stopped
    stop_grace_period: 45s # must exceed the 30s save-flush budget
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0

  moonminer:
    image: ghcr.io/mynameis-nigel/ssh-moonminer:latest
    environment:
      MOONMINER_LISTEN_PORT: "2222"
      MOONMINER_DB_PATH: /var/lib/moonminer/moonminer.db
      MOONMINER_HOST_KEY_PATH: /var/lib/moonminer/ssh_host_key
      MOONMINER_PROXY_KEYS_PATH: /etc/moonminer/proxy_keys
      MOONMINER_RATE_LIMIT_PER_SECOND: "50"
      # Durability — same shape as farm's:
      LITESTREAM_REPLICA_URL: s3://ssharcade-snoigel-data/moonminer/db
      # Refuse to serve unreplicated (§4.1, failure mode 1). Without this the
      # entrypoint's dev-mode fall-through would let a service whose replica URL
      # went missing keep serving players normally while nothing was being
      # backed up — silent until someone needed a restore. Production sets it;
      # dev and CI leave it unset and keep the escape hatch.
      MOONMINER_REQUIRE_REPLICATION: "true"
      LITESTREAM_S3_REGION: us-east-1
      # Read-only mount of the host's canonical copy of this service's SSH
      # host key — see the router's note above for why the MC_HOST_s3 static
      # key pair is gone.
      MOONMINER_HOST_KEY_SOURCE: /etc/moonminer/hostkey/ssh_host_key
    volumes:
      - moonminer-data:/var/lib/moonminer
      - ./private/keys/moonminer:/etc/moonminer/hostkey:ro
      - ./proxy_keys:/etc/moonminer/proxy_keys:ro # PUBLIC half(s) of proxy key
    networks: [ssharcade]
    restart: unless-stopped
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0

  chess:
    image: ghcr.io/mynameis-nigel/ssh-chess:latest
    # NO ports: — private network only; the router is the only way in.
    environment:
      CHESS_LISTEN_PORT: "2222"
      CHESS_DB_PATH: /var/lib/chess/chess.db
      CHESS_HOST_KEY_PATH: /var/lib/chess/ssh_host_key
      CHESS_RATE_LIMIT_PER_SECOND: "50" # router does public throttling
      # The single most important variable not to forget here. Without it
      # CHESS_PROXY_KEYS_PATH is empty ("direct-only dev" per internal/config),
      # the router's bridged connections never match a proxy key, and every
      # player collapses onto ONE identity — the router's own key. In chess
      # that means one shared handle, one shared record, and one player able
      # to resume another's game.
      CHESS_PROXY_KEYS_PATH: /etc/chess/proxy_keys
      # Engine pool. These two are what mem_limit below is sized for; raise
      # them together or not at all.
      CHESS_MAX_ENGINES: "4"
      CHESS_ENGINE_HASH_MB: "16"
      # Durability (doc 06 — canonical; leave unset for dev mode). What is
      # replicated is every unfinished match's move list and clock: a match
      # *is* its move list, so a restored replica is a playable game rather
      # than a position someone has to reconstruct.
      LITESTREAM_REPLICA_URL: s3://ssharcade-snoigel-data/chess/db
      # Refuse to serve unreplicated (§4.1, failure mode 1). Without this the
      # entrypoint's dev-mode fall-through would let a service whose replica URL
      # went missing keep serving players normally while nothing was being
      # backed up — silent until someone needed a restore. Production sets it;
      # dev and CI leave it unset and keep the escape hatch.
      CHESS_REQUIRE_REPLICATION: "true"
      LITESTREAM_S3_REGION: us-east-1
      # Read-only mount of the host's canonical copy of this service's SSH
      # host key — see the router's note above for why the MC_HOST_s3 static
      # key pair is gone.
      CHESS_HOST_KEY_SOURCE: /etc/chess/hostkey/ssh_host_key
      # AWS credentials for litestream come from the EC2 instance role —
      # never set LITESTREAM_ACCESS_KEY_ID/SECRET in this file.
    volumes:
      - chess-data:/var/lib/chess
      - ./private/keys/chess:/etc/chess/hostkey:ro
      - ./proxy_keys:/etc/chess/proxy_keys:ro # PUBLIC half of the router's proxy key
    networks: [ssharcade]
    restart: unless-stopped
    # Inherited from its siblings and correct here for one extra reason: on
    # SIGTERM chess flushes every live match within its 30s budget AND has
    # Stockfish processes to reap.
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # 512m, not the fleet's 256m, and this is a deliberate deviation rather
    # than a copy-paste slip: four Stockfish processes at 16 MB hash each,
    # plus their own overhead, plus the Go runtime, does not fit in 256m.
    # If this has to come back down to 256m, drop CHESS_MAX_ENGINES to 2.
    # Dropping every capability does not stop the game execing Stockfish from
    # a read-only path — capabilities bound what a process may gain, not what
    # it may run.
    mem_limit: 512m
    cpus: 1.0

  # Edge redirector. The only service here that is not part of the arcade
  # itself: it exists so the ssharcade.dev APEX can point at this host's
  # Elastic IP (making `ssh ssharcade.dev` work) without the website
  # 404ing, because one A record necessarily serves port 22 and port 443
  # alike. It answers browsers with a 301 to www.ssharcade.dev, where the
  # real site stays on Vercel. See ./Caddyfile for the full rationale.
  web:
    # Major-version tag, not a floating :latest and not a pinned minor.
    # This is the one image in the file we don't build, so a surprise major
    # bump is the real risk and 2.x is the guard against it. Pin harder
    # (caddy:2.<minor>-alpine, or a digest) if a reproducible host rebuild
    # ever matters more than picking up patch releases on redeploy.
    image: caddy:2-alpine
    ports:
      - "80:80"   # ACME HTTP-01 challenge + plain-http visitors
      - "443:443" # everything a browser actually asks for
    volumes:
      # Single-file mount, same as games.toml and safe for the same reason:
      # the deploy job writes it with `cp`, which truncates in place and
      # keeps the inode. Replace that with an editor's atomic-save or an
      # `mv` and the mount silently pins to the orphaned old inode — see
      # the note on the router's banner mount above.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Issued certificates and the ACME account key. This volume is the
      # reason a redeploy doesn't re-issue: lose it and Caddy starts over
      # against Let's Encrypt's rate limits.
      - caddy-data:/data
      - caddy-config:/config
    # NOT on [ssharcade], and that is the point. This is the only container
    # on the box with an unauthenticated public listener; it has no reason
    # to reach the games, the router, or the proxy key, so it cannot.
    networks: [edge]
    restart: unless-stopped
    stop_grace_period: 10s # holds no state worth flushing
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      # The one deviation from the fleet's drop-everything rule, and it is
      # required rather than convenient: the caddy image runs as root, but
      # a root process with no capabilities still cannot bind a port below
      # 1024. The router sidesteps this by mapping 22->2222 and listening
      # high; Caddy cannot, because http_port/https_port change the ports
      # it puts in generated redirect URLs as well as the ones it binds,
      # which would send browsers to https://ssharcade.dev:8443.
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    # A redirect-only Caddy idles around 25 MB; 128m is headroom for TLS
    # handshake bursts, not a measured requirement. It is deliberately the
    # smallest allocation in the file — this service must never compete
    # with the games for memory.
    mem_limit: 128m
    cpus: 0.5

networks:
  ssharcade: {}
  # Deliberately separate from ssharcade so the public web listener has no
  # route to the game containers. Must NOT be marked `internal: true` —
  # Caddy needs outbound reach to Let's Encrypt to issue and renew.
  edge: {}

volumes:
  arcade-router-data: {}
  farm-data: {}
  moonminer-data: {}
  chess-data: {}
  caddy-data: {}
  caddy-config: {}

secrets:
  proxy_key:
    file: ./secrets/proxy_key
