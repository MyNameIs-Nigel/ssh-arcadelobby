# Fleet deploy compose (docs/04-deployment-and-cicd.md's canonical shape):
# one EC2 host, one router public on 22, every game private on the
# ssharcade network. Deployed copy lives at /srv/ssharcade/docker-compose.yml
# on the host (see ../deploy/README.md for the full bootstrap).
#
# Readiness today (2026-08):
#   router, farm, moonminer — real images, real proxy-identity support, live.
#                     moonminer shipped as a playable prototype (not fully
#                     polished, but stable enough to go live) with its own
#                     ci.yml/release.yml + Dockerfile on the same
#                     Litestream/S3 durability pattern as farm's.
#   chess (GAMBIT) — not here yet. Its service block, chess-data volume and
#                     the deploy/games.toml swap off the `packetderby`
#                     placeholder all land together in ssh-chess's
#                     docs/phase2/06-deployment-and-fleet-onboarding.md, so
#                     production never lists a game with no container.
#
# Idle Farmer v1 (`idlefarmer`) was removed at the v2 cutover: its repo is
# retired and its registry entry went with commit d72d578. ssh-farm is v2 and
# carries the v1 save importer. Adding a game still touches only the compose
# file and games.toml, never the router binary — that goal is unchanged.
services:
  router:
    image: ghcr.io/mynameis-nigel/ssh-arcadelobby:latest
    ports:
      - "22:2222" # host 22 -> container 2222 (non-root bind)
    environment:
      ARCADE_LISTEN_PORT: "2222"
      ARCADE_HOST_KEY_PATH: /var/lib/arcade/ssh_host_key
      ARCADE_PROXY_KEY_PATH: /run/secrets/proxy_key
      ARCADE_GAMES_PATH: /etc/arcade/games.toml
      ARCADE_BANNER_PATH: /etc/arcade/banner/banner.toml
      ARCADE_DB_PATH: /var/lib/arcade/arcade.db
      # Durability (doc 06): router SQLite + two small key objects.
      # Leave unset for dev mode (see entrypoint.sh).
      LITESTREAM_REPLICA_URL: s3://ssharcade-snoigel-data/router/db
      LITESTREAM_S3_REGION: us-east-1
      ARCADE_HOST_KEY_MC_PATH: s3/ssharcade-snoigel-data/keys/router/ssh_host_key
      ARCADE_PROXY_KEY_MC_PATH: s3/ssharcade-snoigel-data/keys/router/proxy_key
      MC_HOST_s3: ${MC_HOST_s3}
      # mc has no EC2-instance-role support, so MC_HOST_s3 needs an explicit
      # key pair scoped to the same bucket-only IAM policy as litestream's
      # instance role (see doc 06) — litestream itself needs no keys here
      # at all since the router doesn't use it. Sourced from a host-side
      # /srv/ssharcade/.env (never committed) via compose variable
      # substitution — never write a literal key pair into this file.
    volumes:
      - arcade-router-data:/var/lib/arcade
      - ./games.toml:/etc/arcade/games.toml:ro
      # Directory mount, not a single-file mount: a single-file bind mount
      # pins to the inode present at container start. Any host-side edit
      # that replaces rather than truncates the file (editors with
      # atomic-save/rename, scp, mv) silently orphans the mount — the
      # container keeps serving the old content forever, no error, no log,
      # until the container is recreated. Directory mounts resolve the path
      # dynamically and survive any write pattern.
      - ./banner:/etc/arcade/banner:ro
    secrets: [proxy_key]
    networks: [ssharcade]
    restart: unless-stopped
    stop_grace_period: 15s # router holds no state; die fast
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0

  farm:
    image: ghcr.io/mynameis-nigel/ssh-farm:latest
    # NO ports: — private network only; the router is the only way in.
    environment:
      FARM_LISTEN_PORT: "2222"
      FARM_HOST_KEY_PATH: /var/lib/farm/ssh_host_key
      FARM_DB_PATH: /var/lib/farm/farm.db
      FARM_RATE_LIMIT_PER_SECOND: "50" # router does public throttling
      # Without this, FARM_PROXY_KEYS_PATH is empty ("direct-only dev" per
      # internal/config), so the router's bridged connections never match
      # isProxyKey() and fall through to resolveDirect() — every player
      # would collapse onto ONE save slot (the router's own key), not
      # their own identity. This is the same proxy_keys trust file the
      # router's secrets provisioning generates (deploy/README.md).
      FARM_PROXY_KEYS_PATH: /etc/farm/proxy_keys
      # Durability (doc 06 — canonical; leave unset for dev mode):
      LITESTREAM_REPLICA_URL: s3://ssharcade-snoigel-data/farm/db
      LITESTREAM_S3_REGION: us-east-1
      FARM_HOST_KEY_MC_PATH: s3/ssharcade-snoigel-data/keys/farm/ssh_host_key
      MC_HOST_s3: ${MC_HOST_s3}
      # AWS credentials for litestream come from the EC2 instance role —
      # never set LITESTREAM_ACCESS_KEY_ID/SECRET in this file.
    volumes:
      - farm-data:/var/lib/farm
      - ./proxy_keys:/etc/farm/proxy_keys:ro # PUBLIC half of the router's proxy key
    networks: [ssharcade]
    restart: unless-stopped
    stop_grace_period: 45s # must exceed the 30s save-flush budget
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0

  moonminer:
    image: ghcr.io/mynameis-nigel/ssh-moonminer:latest
    environment:
      MOONMINER_LISTEN_PORT: "2222"
      MOONMINER_DB_PATH: /var/lib/moonminer/moonminer.db
      MOONMINER_HOST_KEY_PATH: /var/lib/moonminer/ssh_host_key
      MOONMINER_PROXY_KEYS_PATH: /etc/moonminer/proxy_keys
      MOONMINER_RATE_LIMIT_PER_SECOND: "50"
      # Durability — same shape as farm's:
      LITESTREAM_REPLICA_URL: s3://ssharcade-snoigel-data/moonminer/db
      LITESTREAM_S3_REGION: us-east-1
      MOONMINER_HOST_KEY_MC_PATH: s3/ssharcade-snoigel-data/keys/moonminer/ssh_host_key
      MC_HOST_s3: ${MC_HOST_s3}
    volumes:
      - moonminer-data:/var/lib/moonminer
      - ./proxy_keys:/etc/moonminer/proxy_keys:ro # PUBLIC half(s) of proxy key
    networks: [ssharcade]
    restart: unless-stopped
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0

networks:
  ssharcade: {}

volumes:
  arcade-router-data: {}
  farm-data: {}
  moonminer-data: {}

secrets:
  proxy_key:
    file: ./secrets/proxy_key
