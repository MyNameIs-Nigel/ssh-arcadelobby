# ssharcade games registry — dev default.
# Production overrides this with a mounted file (ARCADE_GAMES_PATH); edits
# there are picked up within one probe cycle, no router redeploy needed.
# Schema: docs/03-games-registry-and-health.md

[[games]]
id      = "moonminer"                 # stable key: [a-z0-9-]{1,24}, unique
name    = "MOON MINER"                # menu display
tagline = "Drill asteroids, dodge pirates."
descriptors = ["extraction", "4 worlds", "push-your-luck"]
addr    = "moonminer:22"              # private-network host:port
host_key = ""                         # optional: pinned public key (authorized_keys
                                      # format). Empty = accept any (isolated net).
order   = 10
# No `version` here: moonminer's wish server embeds its internal/version
# const in its SSH banner, live-detected by the health-check prober every
# probe cycle (docs/03's "Fleet version scheme") — no games.toml edit needed
# when the game's version bumps.

[[games]]
id      = "idlefarmer"
name    = "IDLE FARMER"
tagline = "Crops grow while you're away."
descriptors = ["idle", "prestige", "market"]
addr    = "idlefarmer:22"
order   = 20

[[games]]
id      = "packetderby"
name    = "PACKET DERBY"
tagline = "Coming soon..."
descriptors = ["racing", "multiplayer"]
addr    = "packetderby:22"
order   = 30
