name: Release

on:
  release:
    types: [published]

# Never interrupt an active SSM deployment. A host lock also serializes repos.
concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/mynameis-nigel/ssh-arcadelobby

jobs:
  release:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - id: release
        name: Validate release tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must be vMAJOR.MINOR.PATCH"
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  test:
    needs: release
    uses: ./.github/workflows/verify.yml
    with:
      release: true

  publish:
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    needs: [release, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "sha_short=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          labels: |
            org.opencontainers.image.version=v${{ needs.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
          platforms: linux/amd64
          sbom: true
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Smoke-test the candidate digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          docker pull --platform linux/amd64 "$IMAGE_NAME@$DIGEST"
          scripts/ci/smoke-image.sh "$IMAGE_NAME@$DIGEST" "$VERSION"

      - name: Scan the candidate digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --rm ghcr.io/aquasecurity/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --image-src remote --platform linux/amd64 --scanners vuln \
            --severity HIGH,CRITICAL --format json "$IMAGE_NAME@$DIGEST" > "$RUNNER_TEMP/image-scan.json"
          jq -r '.Results[]?.Vulnerabilities[]? |
            [.Severity, .VulnerabilityID, .PkgName, .InstalledVersion, (.FixedVersion // "")] |
            @tsv' "$RUNNER_TEMP/image-scan.json"
          if ! jq -e 'all(.Results[]?.Vulnerabilities[]?; .Severity != "CRITICAL" or (.FixedVersion // "") == "")' \
            "$RUNNER_TEMP/image-scan.json" >/dev/null; then
            echo "::error::The candidate has a critical vulnerability with a fix available."
            exit 1
          fi

      - name: Sign the build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Promote the approved digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.release.outputs.version }}
          SHA_TAG: ${{ steps.meta.outputs.sha_short }}
        run: |
          for tag in "v$VERSION" "$SHA_TAG" latest; do
            docker buildx imagetools create --prefer-index=false --tag "$IMAGE_NAME:$tag" "$IMAGE_NAME@$DIGEST"
            manifest=$(docker buildx imagetools inspect "$IMAGE_NAME:$tag" --format '{{json .Manifest}}')
            test "$(jq -er .digest <<< "$manifest")" = "$DIGEST"
          done

  deploy:
    needs: [release, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.ARCADE_DEPLOY_ROLE }}
          aws-region: us-east-1
      - name: Look up the last recorded production image
        id: previous
        run: |
          previous=$(docker buildx imagetools inspect "$IMAGE_NAME:production" --format '{{json .Manifest}}' 2>/dev/null | jq -r .digest || true)
          if [[ "$previous" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "image=$IMAGE_NAME@$previous" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy release through SSM
        id: rollout
        env:
          INSTANCE_ID: ${{ vars.ARCADE_INSTANCE_ID }}
          IMAGE: ${{ env.IMAGE_NAME }}@${{ needs.publish.outputs.digest }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          jq -n \
            --arg script "$(base64 -w0 scripts/deploy/remote-deploy.sh)" \
            --arg image "$IMAGE" --arg version "$VERSION" \
            --arg compose "$(base64 -w0 deploy/docker-compose.yml)" \
            --arg games "$(base64 -w0 deploy/games.toml)" \
            --arg caddy "$(base64 -w0 deploy/Caddyfile)" \
            '{executionTimeout: ["1500"], commands: [
              "set -eu",
              "script=$(mktemp)",
              "trap \"rm -f $script\" EXIT",
              "printf %s \($script) | base64 -d > \"$script\"",
              "SERVICE=router IMAGE=\($image) VERSION=\($version) COMPOSE_B64=\($compose) GAMES_B64=\($games) CADDY_B64=\($caddy) sh \"$script\""
            ]}' > params.json
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 1800 \
            --comment "deploy router $VERSION" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          # The standard waiter stops too early for a queued host deployment.
          for _ in $(seq 1 170); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success|Cancelled|TimedOut|Failed|Cancelling) break ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}' \
            --output json | tee result.json
          test "$(jq -r .Status result.json)" = Success

      - name: Sign in to record the production image
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Record the deployed digest
        id: record
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE_NAME:production" "$IMAGE_NAME@$DIGEST"
          manifest=$(docker buildx imagetools inspect "$IMAGE_NAME:production" --format '{{json .Manifest}}')
          test "$(jq -er .digest <<< "$manifest")" = "$DIGEST"

      - name: Summarize the deployment attempt
        if: ${{ always() }}
        env:
          VERSION: ${{ needs.release.outputs.version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.image }}
          COMMAND_ID: ${{ steps.rollout.outputs.command_id }}
          ROLLOUT: ${{ steps.rollout.outcome }}
          RECORD: ${{ steps.record.outcome }}
        run: |
          banner="Not verified"
          recovery="See SSM output"
          if [[ "$ROLLOUT" == success ]]; then
            banner="SSH-2.0-$VERSION"
            recovery="No rollback needed"
          elif [[ -f result.json ]]; then
            if jq -e '.Out | contains("Previous build restored.")' result.json >/dev/null; then
              recovery="Previous build restored"
            elif jq -e '.Err | contains("ROLLBACK FAILED")' result.json >/dev/null; then
              recovery="Rollback failed"
            fi
          fi
          {
            echo "### Router rollout: v$VERSION"
            echo
            echo "- Source and fleet config revision: \`$GITHUB_SHA\`"
            echo "- Candidate: \`$IMAGE_NAME@$DIGEST\`"
            echo "- Last recorded production image: \`${PREVIOUS_IMAGE:-Unavailable}\`"
            echo "- Observed router banner: \`$banner\`"
            echo "- SSM command: \`${COMMAND_ID:-Not started}\`"
            echo "- Rollout: $ROLLOUT"
            echo "- Recovery: $recovery"
            echo "- Production digest record: $RECORD"
          } >> "$GITHUB_STEP_SUMMARY"
