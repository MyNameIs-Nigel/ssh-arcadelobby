name: Release

on:
  push:
    branches: [main]

# Two merges close together used to race: both runs publish `:latest` and both
# deploy jobs `cp` their own checkout over /srv/ssharcade, so whichever FINISHES
# last wins — not whichever commit is newer. On 2026-08-09 PRs #8 and #9 merged
# 11s apart; #9 (which swapped packetderby for GAMBIT) deployed at 16:34:47 and
# #8, built from the older commit that predates that swap, overwrote it at
# 16:34:54. Production silently reverted to the previous registry and `:latest`
# pointed at the older image, with both runs reporting success.
#
# One group for the whole workflow, so at most one release is ever in flight,
# and cancel-in-progress so a newer merge supersedes an older one rather than
# queueing behind it and then clobbering it. Superseding is safe here: the
# deploy is `cp` + `docker compose up -d router`, and a cancelled run is always
# followed by the newer one doing the same work from a newer tree.
concurrency:
  group: release-production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "sha_short=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mynameis-nigel/ssh-arcadelobby:latest
            ghcr.io/mynameis-nigel/ssh-arcadelobby:${{ steps.meta.outputs.sha_short }}

  deploy:
    needs: publish
    # Runs directly on the play.ssharcade.dev EC2 host (self-hosted runner
    # installed there, see deploy/README.md) instead of dialing out over
    # SSH: the host's real sshd (port 9922) is locked to one dev IP, and
    # GitHub-hosted runners use ephemeral IPs from a huge, ever-changing
    # range that will never match that allowlist. Running the job on the
    # box itself means no inbound port has to be opened for CI at all.
    runs-on: [self-hosted, production]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Sync compose + registry config
        # banner.toml is deliberately excluded: it's operator-edited live on
        # the host (docs/03's "edit and save, no redeploy" contract) and
        # must never be clobbered by a code merge.
        run: |
          cp docker-compose.yml games.toml /srv/ssharcade/
        working-directory: deploy
      - name: Deploy router
        run: |
          cd /srv/ssharcade
          docker compose pull router
          docker compose up -d router
