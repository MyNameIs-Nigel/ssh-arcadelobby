name: Release

on:
  push:
    branches: [main]

# Two merges close together used to race: both runs publish `:latest` and both
# deploy jobs `cp` their own checkout over /srv/ssharcade, so whichever FINISHES
# last wins — not whichever commit is newer. On 2026-08-09 PRs #8 and #9 merged
# 11s apart; #9 (which swapped packetderby for GAMBIT) deployed at 16:34:47 and
# #8, built from the older commit that predates that swap, overwrote it at
# 16:34:54. Production silently reverted to the previous registry and `:latest`
# pointed at the older image, with both runs reporting success.
#
# The deploy half of that race went away with the deploy job (see below); the
# `:latest` half did not, because two overlapping runs still push the same tag
# and the slower one still wins.
#
# One group for the whole workflow, so at most one release is ever in flight,
# and cancel-in-progress so a newer merge supersedes an older one rather than
# queueing behind it and then clobbering it. Superseding is safe here: a
# cancelled run is always followed by a newer one publishing from a newer tree.
concurrency:
  group: release-production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "sha_short=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mynameis-nigel/ssh-arcadelobby:latest
            ghcr.io/mynameis-nigel/ssh-arcadelobby:${{ steps.meta.outputs.sha_short }}

  # There is no `deploy:` job any more.
  #
  # It ran `runs-on: [self-hosted, production]` — directly on the
  # play.ssharcade.dev host. A self-hosted runner is unsafe on a repo that is
  # going public: for `pull_request` events GitHub reads the workflow file
  # from the PR head, so anyone who can open a fork PR can point `runs-on:` at
  # the `self-hosted` label and execute their own code on the box — which is
  # in the docker group, and holds every player save. The runners were
  # deregistered and uninstalled on 2026-09-04, before any repo is flipped
  # public. Do not reinstate one here.
  #
  # This job did two things nothing else does yet, so both are manual now:
  #
  #   1. Sync `deploy/docker-compose.yml`, `deploy/games.toml` and
  #      `deploy/Caddyfile` to /srv/ssharcade — the whole fleet's compose file
  #      lives here, so a change in this repo is how any game's service block
  #      reaches the host at all. Use `cp`, never `mv`/`install`: games.toml
  #      and the Caddyfile are single-file bind mounts and `cp` truncates in
  #      place, keeping the inode the running containers hold open.
  #      banner.toml stays excluded — it is operator-edited live on the host.
  #   2. `caddy reload` after a Caddyfile change — `up -d` only recreates a
  #      container whose *definition* changed, so a config edit is otherwise
  #      copied and then silently ignored.
  #
  # See deploy/README.md, "Deploying by hand", for the full procedure, and
  # docs/04-deployment-and-cicd.md for where this is going (OIDC + SSM).
