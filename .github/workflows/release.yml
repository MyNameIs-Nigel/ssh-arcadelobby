name: Release

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "sha_short=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mynameis-nigel/ssh-arcadelobby:latest
            ghcr.io/mynameis-nigel/ssh-arcadelobby:${{ steps.meta.outputs.sha_short }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Deliberately gated, not just by the `production` environment (add a
      # required-reviewer protection rule there once this is real) but also
      # by this check: until DEPLOY_HOST is configured, every merge to main
      # would otherwise fail this job loudly with a confusing SSH error.
      # Skipping cleanly here means the workflow can ship today and start
      # actually deploying the moment the environment's secrets are set —
      # no code change needed.
      - name: Check deploy is configured
        id: check
        run: |
          if [ -z "${{ vars.DEPLOY_HOST }}" ]; then
            echo "::notice::DEPLOY_HOST not set for the production environment — skipping deploy. See deploy/README.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /srv/ssharcade
            docker compose pull router
            docker compose up -d router
