name: Release

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "sha_short=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mynameis-nigel/ssh-arcadelobby:latest
            ghcr.io/mynameis-nigel/ssh-arcadelobby:${{ steps.meta.outputs.sha_short }}

  deploy:
    needs: publish
    # Runs directly on the play.ssharcade.dev EC2 host (self-hosted runner
    # installed there, see deploy/README.md) instead of dialing out over
    # SSH: the host's real sshd (port 9922) is locked to one dev IP, and
    # GitHub-hosted runners use ephemeral IPs from a huge, ever-changing
    # range that will never match that allowlist. Running the job on the
    # box itself means no inbound port has to be opened for CI at all.
    runs-on: [self-hosted, production]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Sync compose + registry config
        # banner.toml is deliberately excluded: it's operator-edited live on
        # the host (docs/03's "edit and save, no redeploy" contract) and
        # must never be clobbered by a code merge.
        run: |
          cp docker-compose.yml games.toml /srv/ssharcade/
        working-directory: deploy
      - name: Deploy router
        run: |
          cd /srv/ssharcade
          docker compose pull router
          docker compose up -d router
