name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    needs: verify
    if: ${{ always() }}
    steps:
      - name: Require all verification jobs to pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = success
