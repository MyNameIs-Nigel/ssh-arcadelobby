name: CI

# No `pull_request:` trigger, deliberately. Once these repos are public that
# trigger would run on every fork PR from anyone on the internet. Branches pushed
# inside the repo still get full CI through `push` below — which covers every PR
# opened from a branch here — so the only thing dropped is running unreviewed
# fork code automatically. Review a fork PR, then run this by hand if you want a
# signal on it.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
