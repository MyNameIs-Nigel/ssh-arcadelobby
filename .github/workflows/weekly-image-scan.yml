name: Weekly Image Scan

on:
  schedule:
    - cron: '23 15 * * 1' # Monday morning in Boise.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-image-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Published images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan recorded and approved images
        env:
          CADDY_PRODUCTION_IMAGE: ${{ vars.ARCADE_CADDY_PRODUCTION_IMAGE }}
        run: scripts/ci/scan-published-images.sh "$RUNNER_TEMP/weekly-images"
      - name: Keep reports by digest
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weekly-image-reports-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weekly-images/*.json
          retention-days: 35

  dependencies:
    name: Go dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check reachable Go vulnerabilities
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          status=0
          "$RUNNER_TEMP/bin/govulncheck" ./... > "$RUNNER_TEMP/govulncheck.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/govulncheck.txt"

          case "$status" in
            0) result="No reachable vulnerabilities found" ;;
            3) result="Reachable vulnerabilities found" ;;
            *) result="Govulncheck error (exit $status)" ;;
          esac
          {
            echo "### Go dependency scan"
            echo
            echo "$result"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/govulncheck.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
